apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-attrition-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-attrition-api
  template:
    metadata:
      labels:
        app: employee-attrition-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: employee-attrition-api:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: employee-attrition-api
spec:
  selector:
    app: employee-attrition-api
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
