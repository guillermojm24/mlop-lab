apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediccion-fuga
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediccion-fuga
  template:
    metadata:
      labels:
        app: prediccion-fuga
    spec:
      containers:
        - name: api
          image: prediccion-fuga:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prediccion-fuga
spec:
  selector:
    app: prediccion-fuga
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
