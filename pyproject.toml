[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prediccion-fuga"
version = "1.0.0"
description = "Pipeline reproducible de MLOps para predecir fuga de empleados"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "mlflow>=2.0,<4", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
