stages:
  preparar:
    cmd: PYTHONPATH=src python -m prediccion_fuga.data
    deps:
    - src/prediccion_fuga/data.py
    - src/prediccion_fuga/paths.py
    - src/prediccion_fuga/config.py
    - params.yaml
    params:
    - datos.n
    - datos.seed
    outs:
    - data/empleados.csv
  entrenar:
    cmd: PYTHONPATH=src python -m prediccion_fuga.train
    deps:
    - src/prediccion_fuga/train.py
    - src/prediccion_fuga/data.py
    - src/prediccion_fuga/paths.py
    - src/prediccion_fuga/config.py
    - data/empleados.csv
    - params.yaml
    params:
    - entrenar.n_estimators
    - entrenar.test_size
    - entrenar.random_state
    outs:
    - models/modelo.pkl
    metrics:
    - metrics/metrics.json:
        cache: false
